<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysMan - 服务器管理</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">⚙️</span> SysMan
  </div>
  <div class="host" id="hostname">加载中...</div>
  <div class="time" id="clock"></div>
</header>

<main class="container">

  <!-- 基本信息 -->
  <section class="card">
    <h2>🖥️ 基本信息</h2>
    <div class="grid" id="system-info">
      <div class="loading">加载中...</div>
    </div>
  </section>

  <!-- 资源占用 -->
  <section class="card">
    <h2>📊 实时资源占用</h2>
    <div class="stat-row">
      <div class="stat">
        <div class="stat-label">CPU 使用率</div>
        <div class="stat-value" id="cpu-val">--%</div>
        <div class="bar"><div class="bar-fill bar-cpu" id="cpu-bar"></div></div>
      </div>
      <div class="stat">
        <div class="stat-label">内存使用率</div>
        <div class="stat-value" id="mem-val">--%</div>
        <div class="bar"><div class="bar-fill bar-mem" id="mem-bar"></div></div>
      </div>
    </div>
    <div class="stat-detail" id="stat-detail"></div>
  </section>

  <!-- 磁盘 -->
  <section class="card">
    <h2>💾 磁盘</h2>
    <table class="table" id="disk-table">
      <thead><tr><th>挂载点</th><th>总量</th><th>已用</th><th>可用</th><th>使用率</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Nginx 管理 -->
  <section class="card">
    <h2>🟢 Nginx 管理</h2>
    <div class="nginx-status" id="nginx-status">检测中...</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-install" onclick="installNginx()">安装 Nginx</button>
      <button class="btn btn-warn" id="btn-restart" onclick="restartNginx()">重启 Nginx</button>
      <button class="btn" id="btn-test" onclick="testNginx()">测试配置</button>
    </div>

    <h3 class="config-title">配置文件 <code id="config-path"></code></h3>
    <div class="config-actions">
      <button class="btn" onclick="loadConfig()">重新加载</button>
      <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
    </div>
    <textarea id="config-editor" class="editor" spellcheck="false" placeholder="nginx 配置内容..."></textarea>
  </section>

</main>

<div id="toast" class="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
